  const base = maxN * (D + gap);
  cols.forEach(([label, items], ci) => {
    items.sort((a, b) => b.ev - a.ev || a.name.localeCompare(b.name));
    items.forEach((d, i) => {
      const x = ci * colW + colW / 2 - D / 2, y = base - (i + 1) * (D + gap) + gap;
      dots[d.key].style.transform = `translate(${x}px, ${y}px)`;

    el.style.left = ci * colW + "px"; el.style.width = colW + "px"; el.style.top = base + 8 + "px";
    el.innerHTML = `<b>${items.length}</b>${label}`;
  });

  chart.style.height = axisTop + (state.group === "gesture" ? 22 : 0) + "px";
